    name: Bump npm Package Version

    on:
      workflow_dispatch:
        inputs:
          bump_type:
            description: 'Type of version bump (major, minor, patch, premajor, preminor, prepatch, prerelease)'
            required: true
            default: 'patch'

    jobs:
      bump-version:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v5

          - name: Setup Node.js
            uses: actions/setup-node@v6
            with:
              node-version: lts/*

          - name: Install dependencies
            run: npm ci

          - name: Bump package version
            run: npm version ${{ github.event.inputs.bump_type }} --verbose
            env:
              # Required for npm version to commit changes
              GIT_AUTHOR_NAME: 'github-actions[bot]'
              GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
              GIT_COMMITTER_NAME: 'github-actions[bot]'
              GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'

          - name: Push changes
            run: |
              git log --branches --not --remotes
              git push origin HEAD
